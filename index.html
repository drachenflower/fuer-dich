.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,13,11,.1),rgba(18,13,11,0) 50%,rgba(18,13,11,.45))}
body.open .bg{filter:blur(7px) brightness(.62)}
main{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:grid;
  padding:calc(28px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left))}
.stage{grid-area:1/1;display:flex;flex-direction:column;align-items:center;text-align:center;transition:opacity .7s ease, transform .7s ease}

/* torn paper strips */
.strip{background:var(--paper);color:var(--ink);display:inline-block;position:relative;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.28));
  clip-path:polygon(0% 8%,3% 0%,7% 6%,12% 1%,17% 7%,22% 0%,28% 5%,33% 1%,39% 7%,45% 0%,51% 6%,57% 1%,62% 7%,68% 0%,74% 5%,79% 1%,85% 7%,90% 0%,95% 6%,100% 2%,
                    99% 50%,100% 94%,96% 100%,91% 93%,86% 99%,80% 94%,75% 100%,69% 93%,63% 99%,58% 94%,52% 100%,46% 93%,40% 99%,35% 94%,29% 100%,23% 93%,18% 99%,12% 94%,7% 100%,2% 94%,0% 99%,1% 50%)}
.strip.big{font-family:var(--display);font-size:clamp(2.6rem,12vw,3.6rem);line-height:1;padding:20px 30px 22px;transform:rotate(-2deg)}
.strip.small{font-weight:800;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;padding:12px 22px;transform:rotate(1.5deg);margin-top:-6px}

/* intro */
#intro{justify-content:center;gap:48px;padding-bottom:6vh}
.hero{display:flex;flex-direction:column;align-items:center;width:100%}
.photo{display:block;width:min(88vw,370px);max-width:100%;aspect-ratio:900/555;object-fit:cover;border-radius:20px;
  box-shadow:0 22px 50px rgba(0,0,0,.45)}
.tags{display:flex;flex-direction:column;align-items:center;margin-top:-24px;position:relative}
.sun{position:absolute;z-index:3;top:-34px;right:-22px;width:58px;height:58px;transform:rotate(12deg);animation:wiggle 3.5s ease-in-out infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
@keyframes wiggle{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-6deg)}}
.start{position:relative;border:0;cursor:pointer;background:var(--paper);color:var(--ink);
  font:400 1.45rem/1 var(--display);padding:26px 34px 22px;margin-bottom:6px;
  display:flex;align-items:center;gap:12px;transform:rotate(-3deg);transform-origin:50% 0;
  box-shadow:0 14px 28px rgba(0,0,0,.35),0 2px 4px rgba(0,0,0,.2);
  background-image:linear-gradient(transparent 0 calc(100% - 1px),rgba(42,29,23,.06) 0);background-size:100% 22px}
.start::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(4deg);
  background:repeating-linear-gradient(45deg,rgba(242,169,59,.75) 0 8px,rgba(255,214,150,.75) 8px 16px);
  clip-path:polygon(2% 0,98% 4%,100% 30%,97% 55%,100% 100%,3% 96%,0 70%,3% 45%);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.start:hover{transform:rotate(-1.5deg)}
.start:focus-visible{outline:2px solid var(--light);outline-offset:6px}
.start svg{width:13px;height:13px;fill:currentColor}
body.open .start{animation:fall .8s cubic-bezier(.5,0,.75,0) forwards}
@keyframes fall{0%{transform:rotate(-3deg)}25%{transform:rotate(-12deg)}100%{transform:translateY(60vh) rotate(-28deg);opacity:0}}

/* reveal */
#reveal{justify-content:center;gap:26px;opacity:0;transform:translateY(16px);pointer-events:none}
body.open #intro{opacity:0;transform:translateY(-10px);pointer-events:none}
body.open #reveal{opacity:1;transform:none;pointer-events:auto;transition-delay:.3s}
.player{width:min(100%,360px);border-radius:14px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55)}
#embed,.player iframe{display:block;width:100%;height:352px;border:0}
@media (prefers-reduced-motion:reduce){.stage,.bg{transition:none}.sun,body.open .start{animation:none}}
</style>
